<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #10141D;
      color: #F0F4F8;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 1px solid #252F42;
      padding-bottom: 10px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h2 {
      font-size: 14px;
      margin: 0;
      color: #00E5FF;
      font-weight: 600;
    }
    .version-tag {
      font-size: 10px;
      background: #1B2B44;
      color: #38BDF8;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .status-group {
      background: #161D2B;
      border: 1px solid #25334D;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-badge {
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-badge-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F59E0B;
      box-shadow: 0 0 6px #F59E0B;
      transition: all 0.3s ease;
    }
    .status-dot.online {
      background: #00FF88;
      box-shadow: 0 0 8px #00FF88;
    }
    .status-dot.offline {
      background: #EF4444;
      box-shadow: 0 0 6px #EF4444;
    }
    .status-value {
      font-size: 10px;
      color: #94A3B8;
      font-weight: 500;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 12px;
      color: #A0AEC0;
    }
    input[type="checkbox"] {
      accent-color: #00E5FF;
      cursor: pointer;
    }
    .footer {
      font-size: 10.5px;
      color: #718096;
      margin-top: 14px;
      text-align: center;
      border-top: 1px solid #1E2738;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <img src="icons/icon32.png" width="22" height="22" alt="PRRX Logo" style="border-radius: 4px; vertical-align: middle; object-fit: contain;">
      <h2>PRRX IDM</h2>
    </div>
    <span class="version-tag">v1.7.0</span>
  </div>

  <div class="status-group">
    <div class="status-badge">
      <div class="status-badge-left">
        <div id="dotDesktop" class="status-dot"></div>
        <span>Desktop Engine</span>
      </div>
      <span id="txtDesktopStatus" class="status-value">Checking...</span>
    </div>
    <div class="status-badge">
      <div class="status-badge-left">
        <div id="dotCloud" class="status-dot"></div>
        <span>Cloudflare Edge & D1</span>
      </div>
      <span id="txtCloudStatus" class="status-value">Connecting...</span>
    </div>
    <div class="status-badge">
      <div class="status-badge-left">
        <div id="dotSync" class="status-dot"></div>
        <span>Auto-Sync Bridge</span>
      </div>
      <span id="txtSyncStatus" class="status-value">Checking...</span>
    </div>
  </div>

  <div class="toggle-row">
    <span>Intercept Browser Downloads</span>
    <input type="checkbox" id="chkInterception" checked>
  </div>

  <div class="toggle-row">
    <span>Floating Video Grabber</span>
    <input type="checkbox" id="chkFloatingPanel" checked>
  </div>

  <div class="footer">
    PRRX Cooperation • High-Speed Acceleration
  </div>

  <script src="popup.js"></script>
</body>
</html>
